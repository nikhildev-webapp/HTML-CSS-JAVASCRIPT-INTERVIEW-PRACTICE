<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI_Calculator</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form id="bmiForm" class="bmiForm">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="Enter weight" required>
            <label for="height">Height (cm):</label>
            <input type="number" id="height" placeholder="Enter height" required>
            <button type="submit" onclick="calculateBMI(event)">Calculate BMI</button>
        </form>
        <div id="result"></div>
        <div id="category"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
