<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Marginalia — Notes</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="app.css">
</head>     
<body>
    <div class="app">
  <div class="overlay" id="overlay"></div>
 
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark"></span>
      <h1>Marginalia</h1>
      <span id="noteCount"></span>
    </div>
 
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search notes…" autocomplete="off">
      </div>
      <button class="new-btn" id="newNoteBtn" title="New note (Ctrl/Cmd+N)">+</button>
    </div>
 
    <div class="tag-filters" id="tagFilters"></div>
 
    <div class="note-list" id="noteList"></div>
  </aside>
 
  <main class="main">
    <div class="editor-topbar">
      <div class="left">
        <button class="menu-btn" id="menuBtn" title="Notes">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="tag-select" id="tagSelect"></div>
      </div>
      <div class="editor-actions" id="editorActions">
        <span class="save-indicator" id="saveIndicator"></span>
        <button class="icon-btn" id="pinBtn" title="Pin note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l1 6 3 3v2H5v-2l3-3z"/></svg>
        </button>
        <button class="icon-btn delete" id="deleteBtn" title="Delete note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
        </button>
      </div>
    </div>
 
    <div class="editor-body" id="editorBody">
      <!-- filled dynamically -->
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
