<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-From</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="login-form">
            <div class="msg">
              <h3>Welcome Back!</h3>
              <p>Enter your details to continue to your account.</p>
            </div>
            <div class="input-box">
                <label for="userName">UserName:</label>
                <input type="text" placeholder="Enter your Name.." id="username" name="username">
            </div>
             <div class="input-box">
                <label for="userName">Password:</label>
                <input type="password" placeholder="Enter your Password.." id="password" name="password">
            </div>
            <span id="create-account">Don't have an account? <a href="#" id="signup">Signup</a></span>
            <br><button id="btn">Login</button>
        </form>
    </div>
</body>
</html>
